# Drives the trading loop when nobody has the app open.
#
# Vercel Cron on the Hobby plan fires once per day, which is fine for the
# daily strategy-improvement round but far too slow to trade on. This runs
# every 5 minutes and calls the tick endpoint, which advances the loop by one
# step: refresh candles, settle funding, manage stops and targets, and open
# new positions when a setup qualifies.
#
# Setup: none, if DEFAULT_APP_URL below points at your deployment. Both
# repository secrets are optional overrides:
#
#   APP_URL      a different deployment to drive. Point it at the PRODUCTION
#                URL: preview deployments sit behind Vercel Authentication and
#                answer an unauthenticated request with a 302 to a login page,
#                so every tick would be swallowed by a redirect.
#   CRON_SECRET  the value set in Vercel. Without it the tick endpoint still
#                accepts this workflow, but as an anonymous caller subject to
#                its rate limit — fine at five-minute intervals. With it, the
#                limit does not apply.
#
# Notes:
#   - GitHub runs scheduled workflows on a best-effort basis, and "best
#     effort" is weaker than it sounds: measured on this repository, a */5
#     schedule fired ONCE in nine hours instead of about a hundred times.
#     Runs are silently dropped under load rather than queued. So each run
#     that does fire ticks several times across its budget instead of once —
#     it does not fix the gaps, but it makes a surviving run worth more.
#
#     This matters beyond trade entries: the engine only checks stops when it
#     ticks, so a long gap means a stop can be overshot well past its price
#     before anything notices. If the account is ever to be taken seriously,
#     point a real scheduler at /api/v2/tick — it needs no credentials.
#   - The tick is idempotent and holds a lock, so a late or doubled run is
#     harmless.
#   - GitHub disables schedules after 60 days with no repository activity.
#     Push a commit, or press "Run workflow", to re-arm it.

name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  # The deployment this repository drives. A public URL, so it belongs in the
  # file rather than in a secret nobody can be sure got set.
  DEFAULT_APP_URL: https://crypto-algo-trader.vercel.app

# A slow tick must never have a second run pile up behind it.
concurrency:
  group: trading-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Four ticks, three 65s waits, and curl allowed 60s each: 7m15s in the
    # worst case, against about 3m30s typically.
    timeout-minutes: 9
    steps:
      - name: Advance the trading loop
        env:
          APP_URL: ${{ secrets.APP_URL || env.DEFAULT_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::No APP_URL. Set DEFAULT_APP_URL in this workflow or an APP_URL secret."
            exit 1
          fi

          # A preview deployment redirects to a Vercel login page instead of
          # answering, which would look like a tick that silently did nothing.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 "${APP_URL}/api/v2/health" || echo 000)
          if [ "$status" = "302" ] || [ "$status" = "307" ]; then
            echo "::error::${APP_URL} redirects (HTTP $status) — it is protected by Vercel Authentication. Use the production URL."
            exit 1
          fi

          # The secret is optional: without it the endpoint accepts this as an
          # anonymous caller, which its rate limit allows at this interval.
          auth=()
          if [ -n "${CRON_SECRET:-}" ]; then
            auth=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          # Several ticks per run, spaced just past the endpoint's
          # one-per-minute limit for anonymous callers. The job's own
          # timeout-minutes is the backstop.
          response=""
          for attempt in 1 2 3 4; do
            # `[ ... ] && sleep` would return non-zero on the first pass and
            # `set -e` would end the script there, before a single tick.
            if [ "$attempt" -gt 1 ]; then sleep 65; fi
            # --fail-with-body so a non-2xx still prints why it failed.
            response=$(curl --silent --show-error --fail-with-body \
              --max-time 60 --retry 2 --retry-delay 5 \
              -X POST "${APP_URL}/api/v2/tick" "${auth[@]}") || {
                echo "::warning::tick $attempt failed"
                continue
              }
            echo "tick $attempt: $response"
          done

          if [ -z "$response" ]; then
            echo "::error::every tick in this run failed"
            exit 1
          fi

          # Surface the outcome in the run summary. jq is preinstalled on
          # ubuntu-latest; the // fallbacks keep this working if a field is absent.
          {
            if [ "$(jq -r '.skipped // false' <<< "$response")" = "true" ]; then
              echo "Skipped: $(jq -r '.reason // "unknown"' <<< "$response")"
            else
              echo "- equity: \$$(jq -r '.equity // 0 | . * 10000 | round / 10000' <<< "$response")"
              echo "- positions: $(jq -r '.positions // 0' <<< "$response")"
              echo "- opened: $(jq -r '.opened | length' <<< "$response"), closed: $(jq -r '.closed | length' <<< "$response")"
              echo "- duration: $(jq -r '.durationMs // 0' <<< "$response")ms"
              if [ "$(jq -r '.durable // false' <<< "$response")" != "true" ]; then
                echo "> **Warning:** storage is not durable — set the Upstash env vars in Vercel."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
